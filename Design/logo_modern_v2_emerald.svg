<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215" width="500" height="537">
  <defs>
    <linearGradient id="gTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#071810"/>
      <stop offset="100%" stop-color="#0E2A1A"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0%" y1="0%" x2="110%" y2="120%">
      <stop offset="0%"   stop-color="#0E2A1A"/>
      <stop offset="100%" stop-color="#1B5C38"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0%" y1="0%" x2="100%" y2="110%">
      <stop offset="0%"   stop-color="#1E7A48"/>
      <stop offset="100%" stop-color="#27AE68"/>
    </linearGradient>
    <radialGradient id="gGlow2" cx="70%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#2ECC71" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2ECC71" stop-opacity="0.00"/>
    </radialGradient>
    <linearGradient id="gShine2" x1="0%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="gEdge2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#52D98A" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#52D98A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#52D98A" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Glassmorphism na wycinance -->
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#2ECC71" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip2"><path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z"/></clipPath>
  </defs>

  <!-- Halo -->
  <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="#2ECC71" fill-opacity="0.07"
        transform="scale(1.08) translate(-7.7,-8.5)"/>

  <g filter="url(#shadow2)">
    <rect x="0" y="0" width="100" height="215" fill="url(#gLeft)" clip-path="url(#clip2)"/>
    <rect x="100" y="0" width="100" height="215" fill="url(#gRight)" clip-path="url(#clip2)"/>
    <rect x="0" y="0" width="200" height="66" fill="url(#gTop)" clip-path="url(#clip2)"/>
    <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="url(#gGlow2)" clip-path="url(#clip2)"/>
  </g>

  <!-- Separatory -->
  <line x1="100" y1="6" x2="100" y2="66"
        stroke="#52D98A" stroke-width="0.8" stroke-opacity="0.5" clip-path="url(#clip2)"/>
  <path d="M 8 62 Q 100 72 192 62"
        fill="none" stroke="#52D98A" stroke-width="0.8" stroke-opacity="0.3"
        clip-path="url(#clip2)"/>
  <path d="M 73 66 Q 59 64 59 72 Q 55 122 100 163"
        fill="none" stroke="#52D98A" stroke-width="0.8" stroke-opacity="0.45"
        clip-path="url(#clip2)"/>
  <path d="M 127 66 Q 141 64 141 72 Q 145 122 100 163"
        fill="none" stroke="#52D98A" stroke-width="0.8" stroke-opacity="0.45"
        clip-path="url(#clip2)"/>

  <!-- Glassmorphism wycinanka -->
  <path d="M 73 66 Q 59 64 59 72 Q 55 122 100 163 Q 145 122 141 72 Q 141 64 127 66 Z" fill="white" fill-opacity="0.07" clip-path="url(#clip2)"/>
  <path d="M 73 66 Q 59 64 59 72 Q 55 122 100 163 Q 145 122 141 72 Q 141 64 127 66 Z" fill="white" clip-path="url(#clip2)"/>
  <path d="M 73 66 Q 59 64 59 72 Q 56 105 78 135"
        fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.20"
        clip-path="url(#clip2)"/>

  <!-- Krawędź -->
  <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="none" stroke="url(#gEdge2)" stroke-width="1.3"
        clip-path="url(#clip2)"/>

  <!-- Shine -->
  <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="url(#gShine2)" clip-path="url(#clip2)"/>
</svg>