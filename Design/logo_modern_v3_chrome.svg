<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215" width="500" height="537">
  <defs>
    <linearGradient id="gTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050D07"/>
      <stop offset="100%" stop-color="#0A1C0D"/>
    </linearGradient>
    <linearGradient id="gLeft3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A1C0D"/>
      <stop offset="100%" stop-color="#153520"/>
    </linearGradient>
    <linearGradient id="gRight3" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1B5E3B"/>
      <stop offset="55%"  stop-color="#0F7B52"/>
      <stop offset="100%" stop-color="#00A36C"/>
    </linearGradient>
    <radialGradient id="gHighlight3" cx="72%" cy="35%" r="50%">
      <stop offset="0%"   stop-color="#00E5A0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0.00"/>
    </radialGradient>
    <!-- Metaliczne obramowanie (góra jasna, dół ciemna) -->
    <linearGradient id="gMetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#7FFFD4" stop-opacity="0.7"/>
      <stop offset="35%"  stop-color="#3EB489" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A1C0D" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="gShine3" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="30%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="7" stdDeviation="9"  flood-color="#000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00C87A" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip3"><path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z"/></clipPath>
  </defs>

  <!-- Halo efekt -->
  <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="#00C87A" fill-opacity="0.06"
        transform="scale(1.10) translate(-9.5,-10.5)"/>

  <g filter="url(#shadow3)">
    <rect x="0" y="0" width="100" height="215" fill="url(#gLeft3)" clip-path="url(#clip3)"/>
    <rect x="100" y="0" width="100" height="215" fill="url(#gRight3)" clip-path="url(#clip3)"/>
    <rect x="0" y="0" width="200" height="66" fill="url(#gTop3)" clip-path="url(#clip3)"/>
    <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="url(#gHighlight3)" clip-path="url(#clip3)"/>
  </g>

  <!-- Separatory – cienkie metaliczne linie -->
  <line x1="100" y1="6" x2="100" y2="66"
        stroke="#7FFFD4" stroke-width="0.7" stroke-opacity="0.5" clip-path="url(#clip3)"/>
  <path d="M 8 62 Q 100 72 192 62"
        fill="none" stroke="#7FFFD4" stroke-width="0.7" stroke-opacity="0.28"
        clip-path="url(#clip3)"/>
  <path d="M 73 66 Q 59 64 59 72 Q 55 122 100 163"
        fill="none" stroke="#7FFFD4" stroke-width="0.8" stroke-opacity="0.42"
        clip-path="url(#clip3)"/>
  <path d="M 127 66 Q 141 64 141 72 Q 145 122 100 163"
        fill="none" stroke="#7FFFD4" stroke-width="0.8" stroke-opacity="0.42"
        clip-path="url(#clip3)"/>

  <!-- Wycinanka – czysta biała -->
  <path d="M 73 66 Q 59 64 59 72 Q 55 122 100 163 Q 145 122 141 72 Q 141 64 127 66 Z" fill="white" fill-opacity="0.06" clip-path="url(#clip3)"/>
  <path d="M 73 66 Q 59 64 59 72 Q 55 122 100 163 Q 145 122 141 72 Q 141 64 127 66 Z" fill="white" clip-path="url(#clip3)"/>
  <!-- Lustrzany refleks na krawędzi wycinanki -->
  <path d="M 73 66 Q 60 65 59 73 Q 57 108 76 136"
        fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.18"
        clip-path="url(#clip3)"/>

  <!-- Metaliczne obramowanie -->
  <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="none" stroke="url(#gMetal)" stroke-width="1.4"
        clip-path="url(#clip3)"/>

  <!-- Shine -->
  <path d="M 100 6 C 78 6 15 28 8 62 Q 4 145 100 210 Q 196 145 192 62 C 185 28 122 6 100 6 Z" fill="url(#gShine3)" clip-path="url(#clip3)"/>
</svg>