<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>twojapomocprawna.pl — Pomoc prawna krok po kroku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ─────────────────────────────────────────────────────
       TOKENS — identical to landing-v2.html
    ───────────────────────────────────────────────────── */
    :root {
      --green-dark:  #1C5E3E;
      --green-mid:   #1C7C50;
      --green-light: #25A36A;
      --lime:        #6BBF90;
      --lime-hover:  #52A87A;
      --teal:        #2EC48A;
      --cream:       #F2F0E8;
      --cream-2:     #E8E5DC;
      --cream-3:     #D4EDD8;
      --white:       #FFFFFF;
      --text:        #0D0D0B;
      --text-2:      #3D3A35;
      --text-3:      #7A746D;
      --text-4:      #A8A29C;
      --amber:       #B45309;
      --amber-soft:  #FFFBEB;
      --r-sm: 8px; --r-md: 16px; --r-lg: 24px; --r-pill: 100px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─────────────────────────────────────────────────────
       PROGRESS — 3px top strip, lime gradient
    ───────────────────────────────────────────────────── */
    .progress-track {
      position: fixed; top: 0; left: 0; right: 0;
      height: 3px; background: rgba(255,255,255,0.15); z-index: 300;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--lime), #BAFF5A);
      transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
    }

    /* ─────────────────────────────────────────────────────
       HEADER — dark green frosted, like nav
    ───────────────────────────────────────────────────── */
    .app-header {
      position: fixed; top: 3px; left: 0; right: 0; z-index: 200;
      height: 62px;
      background: rgba(18,64,48,0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.3s;
    }
    .logo {
      font-size: 15px; font-weight: 900; letter-spacing: -0.3px;
      color: #fff; text-decoration: none;
    }
    .logo span { color: var(--lime); }

    .step-badge {
      font-size: 12px; font-weight: 700;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--r-pill); padding: 5px 14px;
    }
    .back-btn {
      background: none; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600;
      color: rgba(255,255,255,0.65);
      font-family: inherit;
      display: flex; align-items: center; gap: 5px;
      transition: color .15s;
    }
    .back-btn:hover { color: #fff; }
    .back-btn svg { width: 16px; height: 16px; }

    /* ─────────────────────────────────────────────────────
       LAYOUT
    ───────────────────────────────────────────────────── */
    .main {
      min-height: 100vh;
      padding-top: 65px;
      display: flex; flex-direction: column; align-items: center;
    }
    .screen-wrap {
      width: 100%; max-width: 600px;
      padding: 0 0 80px;
    }

    /* Screen animation */
    .screen-enter { animation: sIn .3s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes sIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─────────────────────────────────────────────────────
       HERO PANEL — full-width gradient, used for Landing
       and Calm screens
    ───────────────────────────────────────────────────── */
    .hero-panel {
      position: relative;
      background: linear-gradient(150deg, #2E9465 0%, #1F7A52 35%, #196045 65%, #124030 100%);
      overflow: hidden;
      width: 100%;
      padding: 72px 32px 64px;
      text-align: center;
    }
    .hero-panel::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(186,255,90,0.08) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }
    .hero-blob {
      position: absolute; border-radius: 50%;
      pointer-events: none; filter: blur(80px);
    }
    .hero-blob--1 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(46,148,101,0.38) 0%, transparent 70%);
      top: -120px; left: -80px;
    }
    .hero-blob--2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(186,255,90,0.14) 0%, transparent 70%);
      bottom: -100px; right: -60px;
    }
    .hero-inner { position: relative; z-index: 2; }
    .hero-eyebrow {
      display: inline-block;
      color: var(--lime);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.4px; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .hero-title {
      font-size: clamp(32px, 6vw, 54px);
      font-weight: 900;
      color: #fff;
      line-height: 1.08;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
    }
    .hero-title em { font-style: normal; color: var(--lime); }
    .hero-sub {
      font-size: 17px; line-height: 1.65;
      color: rgba(255,255,255,0.62);
      max-width: 440px; margin: 0 auto 36px;
    }

    /* ─────────────────────────────────────────────────────
       CONTENT PANEL — cream bg, used for inner screens
    ───────────────────────────────────────────────────── */
    .content-panel {
      background: var(--cream);
      padding: 36px 32px;
      width: 100%;
    }

    /* Mid-panel — dark green gradient strip, like .steps section */
    .mid-panel {
      position: relative;
      background: linear-gradient(160deg, #1E7A50 0%, #1A6040 50%, #175238 100%);
      overflow: hidden;
      width: 100%;
      padding: 40px 32px;
    }
    .mid-panel::before {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }
    .mid-inner { position: relative; z-index: 2; }

    /* ─────────────────────────────────────────────────────
       TYPOGRAPHY
    ───────────────────────────────────────────────────── */
    .h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.8px; color: var(--text); line-height: 1.18; }
    .h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; color: var(--text); line-height: 1.24; }
    .body-lg { font-size: 17px; line-height: 1.68; color: var(--text-2); }
    .body    { font-size: 15px; line-height: 1.62; color: var(--text-2); }
    .caption { font-size: 13px; line-height: 1.5;  color: var(--text-3); }
    .overline {
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
    }
    .overline--dark  { color: var(--text-4); }
    .overline--light { color: rgba(255,255,255,0.5); }
    .overline--lime  { color: var(--lime); }

    /* ─────────────────────────────────────────────────────
       BUTTONS
    ───────────────────────────────────────────────────── */

    /* Cream on dark (landing primary style) */
    .btn-cream {
      display: block; width: 100%;
      background: var(--cream); color: var(--green-dark);
      font-size: 15px; font-weight: 800; letter-spacing: -0.1px;
      padding: 16px 32px; border-radius: var(--r-pill); border: none;
      cursor: pointer; font-family: inherit; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-cream:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.22); }
    .btn-cream:active { transform: translateY(0); }
    .btn-cream:disabled { background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.4); cursor: not-allowed; transform: none; box-shadow: none; }

    /* Green on light bg */
    .btn-green {
      display: block; width: 100%;
      background: var(--green-mid); color: #fff;
      font-size: 15px; font-weight: 800;
      padding: 16px 32px; border-radius: var(--r-pill); border: none;
      cursor: pointer; font-family: inherit; text-align: center;
      transition: background .2s, transform .15s;
    }
    .btn-green:hover { background: var(--green-dark); transform: translateY(-1px); }
    .btn-green:active { transform: translateY(0); }
    .btn-green:disabled { background: var(--cream-2); color: var(--text-4); cursor: not-allowed; transform: none; }

    /* Outline on light bg */
    .btn-outline {
      display: block; width: 100%;
      background: transparent; color: var(--green-mid);
      font-size: 15px; font-weight: 700;
      padding: 14px 32px; border-radius: var(--r-pill);
      border: 1.5px solid var(--green-mid);
      cursor: pointer; font-family: inherit; text-align: center;
      transition: background .2s, border-color .2s;
    }
    .btn-outline:hover { background: rgba(28,124,80,0.06); }

    /* Ghost on light bg */
    .btn-ghost-light {
      display: block; width: 100%;
      background: transparent; color: var(--text-3);
      font-size: 15px; font-weight: 600;
      padding: 14px 32px; border-radius: var(--r-pill);
      border: 1.5px solid var(--cream-2);
      cursor: pointer; font-family: inherit; text-align: center;
      transition: background .2s, border-color .2s, color .2s;
    }
    .btn-ghost-light:hover { background: var(--white); color: var(--text-2); border-color: var(--cream-2); }

    /* Ghost on dark bg */
    .btn-ghost-dark {
      display: block; width: 100%;
      background: transparent; color: rgba(255,255,255,0.82);
      font-size: 15px; font-weight: 600;
      padding: 14px 32px; border-radius: var(--r-pill);
      border: 1.5px solid rgba(255,255,255,0.28);
      cursor: pointer; font-family: inherit; text-align: center;
      transition: border-color .2s, background .2s, color .2s;
    }
    .btn-ghost-dark:hover { border-color: rgba(255,255,255,0.6); color: #fff; background: rgba(255,255,255,0.08); }

    /* ─────────────────────────────────────────────────────
       TRUST PILLS — white on dark
    ───────────────────────────────────────────────────── */
    .trust-pills {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
      margin: 28px 0;
    }
    .trust-pill {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--r-pill);
      padding: 8px 18px;
      font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,0.85);
      display: flex; align-items: center; gap: 8px;
    }
    .trust-check { color: var(--lime); font-weight: 800; font-size: 12px; }

    /* ─────────────────────────────────────────────────────
       HOW IT WORKS — step cards matching landing
    ───────────────────────────────────────────────────── */
    .how-list { display: flex; flex-direction: column; gap: 10px; }
    .how-card {
      border-radius: var(--r-lg); padding: 24px 28px;
      display: grid; grid-template-columns: 48px 1fr; gap: 16px; align-items: start;
      transition: transform .22s, box-shadow .22s;
    }
    .how-card:hover { transform: translateX(6px); }
    .how-card--white { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
    .how-card--sage  { background: var(--cream-3); box-shadow: 0 4px 24px rgba(28,94,62,0.13); }
    .how-card--glass {
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.32);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .how-num {
      font-size: 46px; font-weight: 900; line-height: 1;
      letter-spacing: -2px; padding-top: 2px;
    }
    .how-card--white .how-num { color: var(--lime); }
    .how-card--sage  .how-num { color: var(--green-dark); }
    .how-card--glass .how-num { color: rgba(168,224,200,0.9); }
    .how-content h4 {
      font-size: 16px; font-weight: 800; letter-spacing: -0.3px;
      margin-bottom: 5px; padding-top: 6px;
    }
    .how-card--white h4 { color: var(--text); }
    .how-card--sage  h4 { color: var(--text); }
    .how-card--glass h4 { color: #fff; }
    .how-content p { font-size: 14px; line-height: 1.6; }
    .how-card--white p { color: var(--text-3); }
    .how-card--sage  p { color: var(--text-3); }
    .how-card--glass p { color: rgba(255,255,255,0.65); }

    /* ─────────────────────────────────────────────────────
       AI GUIDANCE CARD — glass on dark, feature-row on light
    ───────────────────────────────────────────────────── */
    .guide-card-dark {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--r-md);
      padding: 20px 22px;
      position: relative; z-index: 2;
    }
    .guide-card-dark .overline { color: var(--lime); margin-bottom: 10px; }
    .guide-card-dark p { font-size: 15px; line-height: 1.68; color: rgba(255,255,255,0.82); }
    .guide-card-dark p + p { margin-top: 10px; }

    .guide-card-light {
      background: var(--white);
      border: 1px solid var(--cream-2);
      border-left: 3px solid var(--green-mid);
      border-radius: 0 var(--r-md) var(--r-md) 0;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .guide-card-light .overline { color: var(--green-mid); margin-bottom: 8px; }
    .guide-card-light p { font-size: 15px; line-height: 1.65; color: var(--text-2); }
    .guide-card-light p + p { margin-top: 10px; }

    /* ─────────────────────────────────────────────────────
       SAFE BANNER — on light bg
    ───────────────────────────────────────────────────── */
    .safe-banner {
      background: var(--cream-3);
      border: 1.5px solid rgba(28,94,62,0.2);
      border-radius: var(--r-md);
      padding: 16px 20px;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .safe-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green-mid); flex-shrink: 0; margin-top: 5px;
    }
    .safe-text { font-size: 15px; color: var(--green-dark); line-height: 1.55; }
    .safe-text strong { font-weight: 800; }

    /* ─────────────────────────────────────────────────────
       CHOICE BUTTONS
    ───────────────────────────────────────────────────── */
    .choice-list { display: flex; flex-direction: column; gap: 8px; }
    .choice-btn {
      background: var(--white);
      border: 1.5px solid var(--cream-2);
      border-radius: var(--r-md); padding: 16px 20px;
      text-align: left; cursor: pointer;
      font-family: inherit;
      display: flex; align-items: center; gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: all .15s ease;
    }
    .choice-btn:hover {
      border-color: var(--green-mid);
      box-shadow: 0 4px 16px rgba(28,94,62,0.1);
      transform: translateX(3px);
    }
    .choice-btn.selected {
      border-color: var(--green-mid);
      background: var(--cream-3);
      box-shadow: 0 4px 16px rgba(28,94,62,0.12);
    }
    .choice-indicator {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--cream-2);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .choice-btn.selected .choice-indicator {
      border-color: var(--green-mid);
      background: var(--green-mid);
    }
    .choice-btn.selected .choice-indicator::after {
      content: '';
      width: 8px; height: 8px; border-radius: 50%; background: #fff;
    }
    .choice-body { flex: 1; }
    .choice-label {
      font-size: 15px; font-weight: 700;
      color: var(--text); line-height: 1.3;
    }
    .choice-sub {
      font-size: 13px; color: var(--text-3);
      margin-top: 2px; font-weight: 400;
    }

    /* ─────────────────────────────────────────────────────
       TEXTAREA / INPUT
    ───────────────────────────────────────────────────── */
    .field-wrap { position: relative; }
    .textarea {
      width: 100%; border: 1.5px solid var(--cream-2);
      border-radius: var(--r-md); padding: 18px 20px;
      font-size: 16px; font-family: inherit; line-height: 1.6;
      color: var(--text); background: var(--white);
      resize: none; outline: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: border-color .15s, box-shadow .15s;
    }
    .textarea:focus {
      border-color: var(--green-mid);
      box-shadow: 0 0 0 4px rgba(28,124,80,0.08), 0 1px 4px rgba(0,0,0,0.04);
    }
    .textarea::placeholder { color: var(--text-4); }
    .char-count {
      position: absolute; bottom: 14px; right: 18px;
      font-size: 12px; font-weight: 500; color: var(--text-4);
    }
    .text-input {
      width: 100%; border: 1.5px solid var(--cream-2);
      border-radius: var(--r-pill); padding: 15px 22px;
      font-size: 15px; font-family: inherit; color: var(--text);
      background: var(--white); outline: none;
      transition: border-color .15s, box-shadow .15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .text-input:focus {
      border-color: var(--green-mid);
      box-shadow: 0 0 0 4px rgba(28,124,80,0.08);
    }
    .text-input::placeholder { color: var(--text-4); }
    .text-input.error { border-color: #DC2626; }

    /* ─────────────────────────────────────────────────────
       ACTION PLAN STEP CARDS — matching landing step-card
    ───────────────────────────────────────────────────── */
    .action-step {
      background: var(--white);
      border: 1px solid var(--cream-2);
      border-radius: var(--r-lg); padding: 26px 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: transform .22s, box-shadow .22s, border-color .2s;
    }
    .action-step:hover {
      transform: translateX(6px);
      box-shadow: 0 8px 28px rgba(28,74,50,0.1);
      border-color: rgba(28,124,80,0.2);
    }
    .action-step + .action-step { margin-top: 8px; }
    .action-step-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 10px;
    }
    .action-step-num {
      font-size: 44px; font-weight: 900; line-height: 1;
      letter-spacing: -2px; color: var(--lime);
    }
    .action-step-tag {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; padding: 5px 12px;
      border-radius: var(--r-pill);
      margin-top: 6px;
    }
    .tag-critical { background: #FFF3E0; color: var(--amber); border: 1px solid #FFD08A; }
    .tag-high     { background: #FFF7F0; color: #C2410C; border: 1px solid #FED7AA; }
    .tag-normal   { background: var(--cream-3); color: var(--green-dark); border: 1px solid rgba(28,94,62,0.2); }
    .action-step h3 {
      font-size: 17px; font-weight: 800;
      color: var(--text); letter-spacing: -0.3px;
      margin-bottom: 8px;
    }
    .action-step p  { font-size: 14px; line-height: 1.62; color: var(--text-3); }

    /* ─────────────────────────────────────────────────────
       FACT LIST
    ───────────────────────────────────────────────────── */
    .fact-list { list-style: none; }
    .fact-item {
      display: grid; grid-template-columns: 28px 1fr;
      padding: 13px 0; border-bottom: 1px solid var(--cream-2);
      font-size: 15px; line-height: 1.5; gap: 8px; align-items: start;
    }
    .fact-item:last-child { border-bottom: none; }
    .fact-bullet {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green-mid); margin-top: 8px; flex-shrink: 0;
    }
    .fact-label { color: var(--text-3); }
    .fact-value { font-weight: 700; color: var(--text); }

    /* ─────────────────────────────────────────────────────
       WHITE CARD — generic info container
    ───────────────────────────────────────────────────── */
    .white-card {
      background: var(--white);
      border: 1px solid var(--cream-2);
      border-radius: var(--r-lg); padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    /* ─────────────────────────────────────────────────────
       FEATURE ROW — matching landing feature-row
    ───────────────────────────────────────────────────── */
    .feature-row {
      display: grid; grid-template-columns: 28px 1fr; gap: 14px;
      padding: 16px 0; border-bottom: 1px solid var(--cream-2);
      align-items: start;
    }
    .feature-row:last-child { border-bottom: none; }
    .feature-num {
      font-size: 12px; font-weight: 800;
      color: var(--green-mid); opacity: 0.7;
      font-variant-numeric: tabular-nums; padding-top: 2px;
    }
    .feature-text h4 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .feature-text p  { font-size: 13px; line-height: 1.55; color: var(--text-3); }

    /* ─────────────────────────────────────────────────────
       LAWYER CARD
    ───────────────────────────────────────────────────── */
    .lawyer-card {
      background: var(--white); border: 1px solid var(--cream-2);
      border-radius: var(--r-lg); padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: box-shadow .2s, border-color .2s;
    }
    .lawyer-card:hover { box-shadow: 0 6px 24px rgba(28,74,50,0.09); border-color: rgba(28,124,80,0.25); }
    .lawyer-card + .lawyer-card { margin-top: 10px; }
    .lawyer-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
    .lawyer-initials {
      width: 52px; height: 52px; border-radius: var(--r-md);
      background: linear-gradient(135deg, var(--green-mid), var(--green-dark));
      display: flex; align-items: center; justify-content: center;

/* ============================================================
   POST-RENDER HOOKS
============================================================ */
const POST={
  problem:()=>{
    const ta=document.getElementById('problemText');
    if(ta&&state.case.userText){
      ta.value=state.case.userText;
      syncBtn(ta);
      document.getElementById('charCount').textContent=state.case.userText.length+' / 600';
    }
  }
};

/* ============================================================
   HANDLERS
============================================================ */
function onText(ta){
  state.case.userText=ta.value;
  document.getElementById('charCount').textContent=ta.value.length+' / 600';
  syncBtn(ta);
}
function syncBtn(ta){
  const b=document.getElementById('continueBtn');
  if(b) b.disabled=ta.value.trim().length<15;
}
function pick(el,key,val,next){
  el.closest('.choice-list').querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  state.case[key]=val;
  if(next==='calm') triggerAI();
  setTimeout(()=>goTo(next),330);
}
function skipDeadline(){ state.case.deadline=null; triggerAI(); goTo('calm'); }
async function onCalmCta(){
  const btn=document.getElementById('calmCta');
  if(!btn) return;
  if(state.flowState==='ai_complete'||state.flowState==='ai_error'){ goTo('situation'); return; }
  btn.disabled=true; btn.textContent='Analizuję…';
  try{ await state.aiPromise; }catch(_){ state.aiOutput=fallback(state.case.category); }
  goTo('situation');
}
function docDemo(name){ alert('W pełnej wersji: „'+name+'" zostanie wygenerowany przez AI i pobrany jako PDF.'); }
function submitAccount(){
  const el=document.getElementById('emailInput');
  if(!el||el.value.trim().length<5){ if(el) el.classList.add('error'); return; }
  window.location.href='client-portal.html';
}
function setFilter(f){
  state.activeFilter=f;
  render();
}
function openProfile(lawyerId){
  state.selectedLawyer=LAWYERS.find(l=>l.id===lawyerId)||LAWYERS[0];
  goTo('lawyer-profile');
}
function openBooking(lawyerId){
  state.selectedLawyer=LAWYERS.find(l=>l.id===lawyerId)||LAWYERS[0];
  state.booking={ slot:null, type:null, phone:'' };
  goTo('book-date');
}
function pickSlot(i){
  state.booking.slot=i;
  render();
}
function pickType(t){
  state.booking.type=t;
  render();
}

/* ============================================================
   TEMPLATE HELPERS
============================================================ */
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function howCard(n,variant,title,sub){
  return `<div class="how-card how-card--${variant}">
    <div class="how-num">${n}</div>
    <div class="how-content"><h4>${title}</h4><p>${sub}</p></div>
  </div>`;
}

function ch(label,sub,key,val,next){
  const subHtml=sub?`<div class="choice-sub">${sub}</div>`:'';
  return `<button class="choice-btn" onclick="pick(this,'${key}','${val}','${next}')">
    <div class="choice-indicator"></div>
    <div class="choice-body"><div class="choice-label">${label}</div>${subHtml}</div>
  </button>`;
}

function fr(num,title,sub){
  return `<div class="feature-row">
    <div class="feature-num">${num}</div>
    <div class="feature-text"><h4>${title}</h4><p>${sub}</p></div>
  </div>`;
}

/* ============================================================
   BOOT
============================================================ */
render();
</script>
